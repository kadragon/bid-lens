name = "bid-lens"
main = "src/index.ts"
compatibility_date = "2025-05-29"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bid-lens"
database_id = "376cdbc3-2667-4f46-93c9-dd9ad0ef40e5"

[vars]
# Non-secret config
LOG_LEVEL = "info"

# Secrets (set via `wrangler secret put`):
# OPEN_DATA_API_PROXY_URL
# OPEN_DATA_X_API_KEY
