packages:
  - .

# Transitive security pins (vite, postcss, source-map-js, esbuild — see Dependabot alerts).
# vite arrives as a vitest peer, so its version is not reachable from package.json ranges.
# Drop these once vitest/@cloudflare/vitest-plugin resolve the patched versions on their own.
overrides:
  vite: ^7.3.7
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  esbuild: ^0.28.1

allowBuilds:
  "@biomejs/biome": true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.4.6"
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
