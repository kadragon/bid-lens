packages:
  - .

# Transitive security pins (GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3, GHSA-g7r4-m6w7-qqqr).
# vite arrives as a vitest peer, so its version is not reachable from package.json ranges.
# Drop these once vitest/@cloudflare/vitest-pool-workers resolve the patched versions on their own.
overrides:
  vite: ^7.3.6
  esbuild: ^0.28.1

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
